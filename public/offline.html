<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Forkcast</title>
<style>
  :root { --bg:#f7f3ec; --ink:#23201b; --muted:#6f675c; --brand:#2f6b4f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#171512; --ink:#f1ece4; --muted:#a99f92; --brand:#6fbf94; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, sans-serif; padding:24px; text-align:center; }
  img { width:56px; height:56px; border-radius:14px; }
  h1 { font-family: Georgia, serif; margin:16px 0 4px; }
  p { color:var(--muted); margin:0 0 20px; }
  button { background:var(--brand); color:#fff; border:0; border-radius:12px; padding:10px 18px; font:inherit; }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <h1>No connection</h1>
    <p>Forkcast needs the internet to load your meals.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
